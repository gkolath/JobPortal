app = "job-match-portal"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  ADZUNA_COUNTRY = "in"
  DEFAULT_LOCATION = "Bangalore"
  MAX_USERS = "2"
  RUN_SEED = "1"
